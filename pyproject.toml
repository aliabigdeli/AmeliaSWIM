[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amelia_swim"
version = "1.0.0"
description = "Tools for Amelia dataset analysis."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
dependencies = [
    'setuptools',
    'tqdm==4.65.0',
    'minio',
    'numpy==1.21.2',
    'pykml',
    'easydict==1.10',
    'pandas==1.5.2',
    'hydra-core==1.3.2',
    'hydra_colorlog==1.2.0',
    'geographiclib==2.0',
    'joblib==1.2.0',
    'shapely==2.0.3',
    'python-dateutil==2.9.0',
    "requests>=2.32.4",
]

authors = [
    {name = "Ingrid Navarro"},
    {name = "Pablo Ortega"},
    {name = "Jay Patrikar"},
    {name = "Haichuan Wang"},
    {name = "Jong Hoon Park"},
]

[tool.setuptools.packages.find]
include = ["amelia_swim"]

# Ship the airport geofences and hydra configs inside the wheel so the processor
# is usable from an installed package, not just from a source checkout. `conf/`
# is kept as data rather than a subpackage, so locate it with
# importlib.resources.files("amelia_swim") / "conf".
# conf/qgist is deliberately excluded: 45 MB of QGIS project files that nothing
# imports at runtime.
[tool.setuptools.package-data]
amelia_swim = [
    "conf/*.yaml",
    "conf/airports/*.yaml",
    "conf/data/**/*.yaml",
    "conf/fences/*.csv",
]


[project.urls]
Repository = "https://github.com/AmeliaCMU/AmeliaSWIM"
Homepage = "https://ameliacmu.github.io"
